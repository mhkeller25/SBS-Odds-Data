name: Collect Odds — MLB Game Day (3h)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-gameday:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch MLB game-day odds snapshot
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, urllib.error, datetime, os

          KEY   = os.environ['ODDS_KEY']
          SPORT = 'baseball_mlb'

          NOW       = datetime.datetime.utcnow()
          TODAY     = NOW.strftime('%Y-%m-%d')
          TIMESTAMP = NOW.strftime('%Y-%m-%dT%H:%M:%SZ')
          MONTH     = NOW.strftime('%Y-%m')

          print(f'Checking for {SPORT} games on {TODAY} (UTC)...')

          url = (
              f'https://api.the-odds-api.com/v4/sports/{SPORT}/odds/'
              f'?apiKey={KEY}&regions=us&markets=spreads,totals,h2h&oddsFormat=american'
          )
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'SBS-OddsCollector/1.0'})
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
          except Exception as e:
              print(f'Error fetching odds: {e}')
              exit(0)

          if not isinstance(data, list):
              print('Unexpected API response — exiting')
              exit(0)

          # Filter to only games starting today (UTC)
          today_games = [ev for ev in data if ev.get('commence_time', '').startswith(TODAY)]
          if not today_games:
              print(f'No {SPORT} games today — skipping')
              exit(0)

          print(f'Found {len(today_games)} game(s) today — snapshotting today\'s games only')

          # Build snapshot for TODAY'S games only
          games = []
          for ev in today_games:
              if not ev.get('bookmakers'):
                  continue
              markets = ev['bookmakers'][0].get('markets', [])

              def find_market(key):
                  return next((m for m in markets if m['key'] == key), None)

              def find_outcome(market, name):
                  if not market:
                      return None
                  return next((o for o in market.get('outcomes', []) if o.get('name') == name), None)

              spreads_mkt = find_market('spreads')
              totals_mkt  = find_market('totals')
              h2h_mkt     = find_market('h2h')

              aw_spr = find_outcome(spreads_mkt, ev['away_team'])
              ou_out = find_outcome(totals_mkt,  'Over')
              aw_ml  = find_outcome(h2h_mkt,     ev['away_team'])
              hm_ml  = find_outcome(h2h_mkt,     ev['home_team'])

              games.append({
                  'id':    ev['id'],
                  'away':  ev['away_team'],
                  'home':  ev['home_team'],
                  'start': ev['commence_time'],
                  'rl':    aw_spr['point']  if aw_spr else None,
                  'ou':    ou_out['point']  if ou_out else None,
                  'ml_aw': aw_ml['price']   if aw_ml  else None,
                  'ml_hm': hm_ml['price']   if hm_ml  else None,
              })

          if not games:
              print('No today\'s games with odds data — skipping')
              exit(0)

          filepath = f'data/{SPORT}/{MONTH}.json'
          os.makedirs(os.path.dirname(filepath), exist_ok=True)

          if os.path.exists(filepath):
              with open(filepath, 'r') as f:
                  existing = json.load(f)
          else:
              existing = []

          # 2h dedup — lets ~3h cadence through without overlapping the main 4h workflow
          if existing:
              last_ts = datetime.datetime.strptime(existing[-1]['ts'], '%Y-%m-%dT%H:%M:%SZ')
              hours_since = (NOW - last_ts).total_seconds() / 3600
              if hours_since < 2:
                  print(f'Skipping — last snapshot {hours_since:.1f}h ago (< 2h game-day window)')
                  exit(0)

          existing.append({'ts': TIMESTAMP, 'games': games})

          with open(filepath, 'w') as f:
              json.dump(existing, f, separators=(',', ':'))

          print(f'Saved {len(games)} game(s). Total snapshots this month: {len(existing)}')
          PYEOF

      - name: Commit and push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            git commit -m "game-day MLB snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
